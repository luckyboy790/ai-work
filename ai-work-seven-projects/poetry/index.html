  <button id="enterButton" class="enter-button"><span id="enterLabel">循泉入山</span><span class="enter-arrow" aria-hidden="true">↗</span></button>

  <button id="hideButton" class="icon-button" aria-label="隐藏界面，按 H 恢复" title="静看 · H"><svg viewBox="0 0 24 24" fill="none"><path d="M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6"/></svg></button>

class Soundscape{

function updateUI(dt){if(!world||!renderer)return;const cw=renderer.width,ch=renderer.height;activeHotspot=null;let nearest=Infinity;for(const h of world.hotspots){let [x,y,visible]=renderer.project(h.position),dist=V.len(V.sub(h.position,camera.eye)),walkDist=Math.hypot(camera.eye[0]-h.stand[0],camera.eye[2]-h.stand[2]),dy=Math.abs(camera.eye[1]-h.stand[1]-1.65);let shown=visible&&x>22&&x<cw-25&&y>91&&y<ch-(body.classList.contains('exploring')?90:192);if(h.secret&&dist>(mode==='overview'?48:20))shown=false;if(index===5&&h.id==='clouds'&&world.state.opening<.65)shown=false;if(mode==='voyage')shown=false;if(!body.classList.contains('exploring')&&x<cw*.35&&y<ch*.7)shown=false;h.element.style.opacity=shown?(mode==='walk'&&walkDist>h.range?.45:.96):0;h.element.style.visibility=shown?'visible':'hidden';h.element.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,-50%)`;h.element.tabIndex=shown?0:-1;if(mode==='walk'&&walkDist<h.range&&dy<h.range*.8&&walkDist<nearest){nearest=walkDist;activeHotspot=h;}}
let ca=$('#contextAction');ca.classList.toggle('visible',!!activeHotspot&&mode==='walk'&&!transition);if(activeHotspot)$('#contextLabel').textContent=activeHotspot.label+' · 与景相遇';$('#touchInteract').style.opacity=activeHotspot?'1':'.45';if(poemUntil>time){let [x,y,vis]=renderer.project(poemPosition);x=clamp(x,cw<821?cw*.5:210,cw<821?cw*.5:cw-220);y=clamp(y,ch*.24,ch*.64);$('#poem').style.left=x+'px';$('#poem').style.top=y+'px';$('#poem').classList.toggle('visible',vis&&poemUntil-time>.7);}else $('#poem').classList.remove('visible');
// Quiet, repeatable proximity responses never start vehicles or rotate the camera.
if(mode==='walk'&&activeHotspot&&lastSpeed<.05&&!transition&&$('#dialogBackdrop').hidden){let h=activeHotspot;h.dwell=(h.dwell||0)+dt;const passive=['water','bamboo','shadow','pass','gaze'];if(passive.includes(h.id)&&h.dwell>3&&time-(h.lastDwell||-30)>25){h.lastDwell=time;if(h.id==='bamboo')world.state.bambooStart=time;if(h.id==='gaze'){let aim=V.norm(V.sub([17,7,-20],camera.eye));if(V.dot(aim,context.forward)<.92)return;world.state.gaze=time;}reveal(h.quote,h.position);audio.chime(1);}}else world.hotspots.forEach(h=>h.dwell=0);
}
function frame(now){requestAnimationFrame(frame);let elapsed=Math.min(.8,(now-(last||now))/1000),dt=Math.min(.25,elapsed);last=now;if(document.hidden)return;time+=elapsed;if(!world||!renderer)return;updateCamera(dt);world.update(time,dt,context);rippleData[2]=time-rippleAt;renderer.render(world,camera,reduced?0:time,rippleData);updateUI(dt);}
$('#enterButton').onclick=enterWalk;$('#home').onclick=()=>showOverview();$('#modeButton').onclick=()=>{if(mode==='overview')enterWalk();else showOverview();};$('#soundButton').onclick=()=>audio.toggle();$('#helpButton').onclick=()=>openDialog('help');$('#readButton').onclick=()=>openDialog('read');$('#mapButton').onclick=()=>openDialog('map');$('#settingsButton').onclick=()=>openDialog('settings');$('#photoButton').onclick=capturePhoto;$('#hideButton').onclick=()=>setHidden(true);$('#restoreUI').onclick=()=>setHidden(false);$('#contextAction').onclick=interact;$('#touchInteract').onclick=interact;$('#openTray').onclick=openTray;$('#closeTray').onclick=()=>{body.classList.add('exploring');body.classList.remove('tray-open');};$('#previousScene').onclick=()=>switchWorld(index-1);$('#nextScene').onclick=()=>switchWorld(index+1);$('#dialogClose').onclick=closeDialog;$('#dialogBackdrop').onclick=e=>{if(e.target===$('#dialogBackdrop'))closeDialog();};$('#leaveBoat').onclick=()=>{if(!world.vehicle?.active)return;let v=world.vehicle;v.route=[v.pos.slice(),[-3,.05,3],[-8,.05,6]];v.duration=7;v.start=time;$('#leaveBoat').disabled=true;toast('轻舟正在沿水道返岸。');};
window.addEventListener('hashchange',()=>{let i=POEMS.findIndex(p=>p.id===location.hash.slice(1));if(i>=0&&i!==index)switchWorld(i);});

window.shijing={get state(){return{scene:POEMS[index].id,index,mode,transitioning:!!transition,activeHotspot:activeHotspot?.id||null,inputKeys:Array.from(keys),camera:JSON.parse(JSON.stringify(camera)),position:walk.pos.slice(),time,reduced,quality,sound:audio.enabled,audioState:audio.ctx?.state||'not-created',poemVisible:poemUntil>time,photoCount,drawCalls:renderer?.drawCalls,triangles:renderer?.triangles,webgl:!!renderer,worldState:world?JSON.parse(JSON.stringify(world.state)):null};}};
if(new URLSearchParams(location.search).get('test')==='1'){window.shijing.test={switchScene:i=>switchWorld(i,true),activate:id=>{let h=world.hotspots.find(h=>h.id===id);if(h)activate(h);},getWorld:()=>world,setWalk:(p,look)=>{mode='walk';transition=null;walk.pos=p.slice();let eye=V.add(p,[0,1.65,0]),d=V.norm(V.sub(look||V.add(eye,[0,0,-1]),eye));walk.yaw=Math.atan2(d[0],-d[2]);walk.pitch=Math.asin(d[1]);camera.eye=eye;camera.at=V.add(eye,d);body.classList.add('exploring','walking');},setState:(k,v)=>{world.state[k]=v;},getRenderer:()=>renderer,advance:(s)=>{time+=s;updateCamera(.04);world.update(time,.04,context);renderer.render(world,camera,reduced?0:time,rippleData);updateUI(.04);},canWalk:(x,z,y)=>world.canWalk(x,z,y),capture:capturePhoto};}
buildTabs();try{renderer=new P3D.Renderer(canvas);}catch(e){console.warn('诗境: WebGL unavailable',e.message);body.classList.add('no-webgl');$('#fallbackMessage').hidden=false;$('#modeText').textContent='三维未启用';$('#modeButton').disabled=true;}let initial=POEMS.findIndex(p=>p.id===location.hash.slice(1));switchWorld(initial<0?0:initial,true);updateSoundUI();requestAnimationFrame(frame);
